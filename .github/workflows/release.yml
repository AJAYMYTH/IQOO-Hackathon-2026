name: Build & Release APK

on:
  push:
    tags:
      - '*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (e.g., v1.0.0)'
        required: false
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Publish Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set Up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set Up Android SDK Tools
        uses: android-actions/setup-android@v3

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Build Release & Debug APKs
        env:
          GITHUB_CLIENT_ID: ${{ secrets.GITHUB_CLIENT_ID || 'Ov23liZPOsPuWwr6VQTG' }}
        run: |
          ./gradlew assembleRelease assembleDebug -x lint -x lintVitalAnalyzeRelease --stacktrace

      - name: Prepare APK Artifacts & Checksums
        id: prepare_artifacts
        run: |
          TAG_NAME="${{ github.ref_name }}"
          if [ -z "$TAG_NAME" ] || [ "$TAG_NAME" = "main" ]; then
            TAG_NAME="${{ github.event.inputs.tag_name || 'v1.0.0' }}"
          fi

          mkdir -p release-artifacts
          
          # Copy and rename Release APK
          if [ -f "app/build/outputs/apk/release/app-release.apk" ]; then
            cp "app/build/outputs/apk/release/app-release.apk" "release-artifacts/RepoGuardian-${TAG_NAME}.apk"
          fi
          
          # Copy and rename Debug APK
          if [ -f "app/build/outputs/apk/debug/app-debug.apk" ]; then
            cp "app/build/outputs/apk/debug/app-debug.apk" "release-artifacts/RepoGuardian-${TAG_NAME}-debug.apk"
          fi

          # Generate SHA256 Checksums
          cd release-artifacts
          sha256sum *.apk > checksums.sha256
          cat checksums.sha256
          cd ..

          echo "tag_name=${TAG_NAME}" >> $GITHUB_OUTPUT

      - name: Generate Release Notes Body
        id: release_notes
        run: |
          TAG="${{ steps.prepare_artifacts.outputs.tag_name }}"
          cat << EOF > release_body.md
          ## 🛡️ Repo Guardian ${TAG}

          Welcome to the official release of **Repo Guardian** — the on-device AI code review and CI/CD generation platform for Android!

          ---

          ### 📱 Download & Installation:
          | Asset | Description |
          | :--- | :--- |
          | 📦 **\`RepoGuardian-${TAG}.apk\`** | **Standard Production Release** (Optimized & Pre-signed) |
          | 🛠️ **\`RepoGuardian-${TAG}-debug.apk\`** | **Developer Debug Build** (Verbose logs enabled) |
          | 🔒 **\`checksums.sha256\`** | **SHA-256 Checksums** for security verification |

          ---

          ### 🚀 Key Highlights & Features:
          - 🧠 **On-Device LLM Inference:** Powered by embedded \`llama.cpp\` C++ engine for offline, privacy-first AI code reviews.
          - ⚡ **Qualcomm Snapdragon Acceleration:** Supports configurable **CPU**, **Adreno GPU (OpenCL)**, and **Hexagon NPU (HTP)** inference profiles.
          - 🔑 **Instant GitHub OAuth Device Flow:** Zero manual typing with auto-filling verification URLs.
          - 🔽 **Multi-Repository Switcher:** Switch between your GitHub repositories in real time directly from the top bar.
          - 🛠️ **One-Tap Fix Pull Requests:** Automatic review feedback with automated branch creation and PR submission.
          - 🎙️ **Voice Command Trigger:** Hands-free voice trigger (*"review"*, *"check"*) for instant commit reviews.
          - 📦 **In-App Model & Cache Manager:** One-tap Hugging Face GGUF model download and storage cleaner.

          ---
          EOF

      - name: Create GitHub Release & Upload APKs
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.prepare_artifacts.outputs.tag_name }}
          name: "Repo Guardian ${{ steps.prepare_artifacts.outputs.tag_name }}"
          body_path: release_body.md
          generate_release_notes: true
          draft: false
          prerelease: false
          files: |
            release-artifacts/*.apk
            release-artifacts/checksums.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
